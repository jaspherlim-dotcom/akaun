<style>
/* Layout: e-wallet style app column — gradient hero with total receivable, floating shortcut card, soft tiles, bottom tab bar with raised centre button. Documents stay white A4 paper in both themes. */
:root{

  --paper:#FFFFFF; --paper-ink:#1B1F2A; --paper-line:#DADFE8; --paper-muted:#666E80; --paper-accent:#2B4FE0;

  --f-body:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#181C30; --soft:#20263F; --line:#2A3050; --fg:#E7EAF5; --muted:#99A0BA;
  --accent:#7D97FF; --accent-soft:#232C55; --accent-fg:#0B1030;
  --warn:#F3A64A; --warn-soft:#3A2A14; --bad:#F27D72; --bad-soft:#3E1D1B; --good:#5ACD8C; --good-soft:#15321F; --info:#8DA4FF; --info-soft:#232C55;
  --i-orange-bg:#3A2614; --i-violet-bg:#2A2350; --i-blue-bg:#16304A; --i-green-bg:#143326; --i-pink-bg:#3C1A28; --i-yellow-bg:#3A3112;
  --overlay:rgba(0,0,0,.65); --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#181C30; --soft:#20263F; --line:#2A3050; --fg:#E7EAF5; --muted:#99A0BA;

  --overlay:rgba(0,0,0,.65); --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.shortcuts{margin-top:-46px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 8px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative;z-index:2}

.sec{display:flex;justify-content:space-between;align-items:baseline}

.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;background:none;width:100%;text-align:left;color:var(--fg);border-bottom:1px solid var(--line)}

.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.modal{background:var(--surface);border-radius:20px;width:min(880px,100%);display:flex;flex-direction:column;min-width:0}

function calc(doc){
  const lines=doc.items.map(i=>({...i,amt:r2((+i.q||0)*(+i.p||0))}));
  const sub=r2(lines.reduce((a,l)=>a+l.amt,0));
  const disc=Math.min(+doc.discount||0,sub);
  const f=sub?(sub-disc)/sub:0;
  const tax={};
  lines.forEach(l=>{const t=S.company.sstOn?l.t:'none';if(TAX[t]&&TAX[t].rate){tax[t]=(tax[t]||0)+l.amt*f*TAX[t].rate}});
  Object.keys(tax).forEach(k=>tax[k]=r2(tax[k]));
  const taxSum=r2(Object.values(tax).reduce((a,b)=>a+b,0));
  return {lines,sub,disc,tax,taxSum,total:r2(sub-disc+taxSum)};
}

}

/* number to words: Malaysian receipts commonly print "Ringgit Malaysia ... Only" */
function words(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const h=x=>{let s='';if(x>=100){s+=a[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' '}if(x>=20){s+=b[Math.floor(x/10)];if(x%10)s+='-'+a[x%10]}else if(x)s+=a[x];return s};
  const big=x=>{if(x===0)return 'Zero';const u=[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']];let s='';for(const [v,w] of u){if(x>=v){s+=h(Math.floor(x/v))+' '+w+' ';x%=v}}s+=h(x);return s.trim()};
  const rmI=Math.floor(n+1e-9),sen=Math.round((n-rmI)*100);
  return 'Ringgit Malaysia '+big(rmI)+(sen?' and Sen '+big(sen):'')+' Only';
}

function bbItems(k){return `<table class="it"><thead><tr><th>Description</th><th class="c">Qty.</th><th class="r" style="text-align:center">Price</th><th class="r" style="text-align:right">Amount RM</th></tr></thead><tbody>

function payForm(id){
  const i=S.invoices.find(x=>x.id===id),bal=r2(calc(i).total-paidOf(i));
  openModal(`记录收款 · ${i.no}`,`
    <p style="margin:0;color:var(--muted)">${esc(cust(i.cust).name)} · 发票总额 RM ${rm(calc(i).total)} · 尚欠 <b style="color:var(--fg)">RM ${rm(bal)}</b></p>

function toInv(qid){
  const q=S.quotes.find(x=>x.id===qid);

function editor(kind,existing){
  const date=today();

  draft._kind=kind;draft._new=!existing;

  openModal(existing?`编辑${lab} ${existing.no}`:`新${lab}`,`
    <form id="edF" class="form">
      <label class="f full">客户<select id="e-cust">${S.customers.map(c=>`<option value="${c.id}" ${c.id===draft.cust?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>

      <div class="full tbl-wrap"><table class="items"><thead><tr><th>项目 / 服务描述</th><th style="width:70px">数量</th><th style="width:120px">单价 (RM)</th><th style="width:140px">税项</th><th style="width:110px;text-align:right">金额</th><th style="width:32px"></th></tr></thead><tbody id="e-items"></tbody></table>
      <button type="button" class="btn ghost sm" data-act="addLine" style="margin-top:6px">+ 加一项</button></div>
      <label class="f">折扣 (RM)<input id="e-disc" type="number" step="0.01" min="0" value="${draft.discount}"></label>
      <label class="f">备注<input id="e-notes" value="${esc(draft.notes)}" placeholder="例如：确认后先付 50% 订金"></label>
      <div class="full totals num" id="e-tot"></div>
      ${!S.company.sstOn?'<div class="full note">公司设置里 SST 已关闭，这张单据不会收 SST。</div>':''}
      <div id="e-err" class="full" style="color:var(--bad)" hidden></div>
    </form>`,
    `<button class="btn" data-act="close">取消</button><button class="btn pri" form="edF" type="submit">${existing?'保存':'创建'+lab}</button>`);
  drawLines();
  $('#edF').addEventListener('input',e=>{const t=e.target;
    if(t.dataset.f){const i=+t.dataset.i;draft.items[i][t.dataset.f]=t.dataset.f==='d'||t.dataset.f==='t'?t.value:+t.value;updTot()}
    if(t.id==='e-disc'){draft.discount=+t.value;updTot()}
    if(t.id==='e-date'){draft.date=t.value;$('#e-end').value=addDays(t.value,kind==='Q'?S.company.validity:S.company.terms)}
  });
  $('#edF').onsubmit=e=>{e.preventDefault();
    draft.cust=$('#e-cust').value;draft.date=$('#e-date').value;draft.notes=$('#e-notes').value.trim();
    if(kind==='Q')draft.valid=$('#e-end').value;else draft.due=$('#e-end').value;
    draft.items=draft.items.filter(i=>i.d.trim()&&i.q>0);
    if(!draft.items.length){const er=$('#e-err');er.textContent='至少要有一项填了描述和数量的项目。';er.hidden=false;if(!draft.items.length)draft.items=[{d:'',q:1,p:0,t:S.company.defTax}];drawLines();return}
    const isNew=draft._new;delete draft._kind;delete draft._new;
    const arr=kind==='Q'?S.quotes:S.invoices;
    if(isNew){draft.no=nextNo(kind==='Q'?'QT':'INV',draft.date);arr.push(draft)}else{arr[arr.findIndex(x=>x.id===draft.id)]=draft}
    save();go('docs',kind==='Q'?'quotes':'invoices');toast(isNew?`已创建 ${draft.no}`:'已保存');
    (kind==='Q'?viewQ:viewI)(draft.id);
  };
}

  $('#e-items').innerHTML=draft.items.map((it,i)=>`<tr>

const HDR={name:['name','customer','customer name','supplier','supplier name','vendor','供应商','供应商名称','company','company name','客户','客户名称','公司','公司名称','名称'],brn:['brn','ssm','reg no','registration no','registration no.','ssm no','注册号','ssm注册号','身份证','ic'],tin:['tin','tax id','税号','税务编号'],sst:['sst','sst no','sst no.','sst号'],addr:['address','addr','地址'],email:['email','e-mail','电邮','邮箱'],phone:['phone','tel','mobile','contact','电话','手机']};
function parseCSV(txt){
  const rows=[];let row=[],cur='',q=false;
  txt=txt.replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch==='\t'){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function mapRows(rows){
  if(rows.length<2)return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const idx={};Object.entries(HDR).forEach(([k,al])=>{const i=h.findIndex(x=>al.includes(x));if(i>=0)idx[k]=i});
  if(idx.name==null)return null;
  return rows.slice(1).map(r=>{const o={id:uid()};Object.keys(HDR).forEach(k=>o[k]=idx[k]!=null?(r[idx[k]]||'').trim():'');return o}).filter(o=>o.name);
}

  const out=mapRows(parseCSV(txt));const box=$('#custPrev');
  if(out===null){box.innerHTML='<div class="note"><b>找不到“客户名称”栏。</b>第一行请放栏位名称，例如 name 或 客户名称。</div>';pending=[];$('#doImport').disabled=true;return}

function barChart(months){
  const data=months.map(m=>({m,r:revTotal(m),e:expTotal(m)}));
  const max=Math.max(1,...data.flatMap(d=>[d.r,d.e]));const step=Math.pow(10,Math.floor(Math.log10(max)));const top=[1,2,2.5,5,10].map(k=>k*step).find(v=>v>=max);
  const W=340,H=190,L=40,B=24,T=10,ph=H-B-T,gw=(W-L-6)/data.length,bw=Math.min(16,gw/3);
  const y=v=>T+ph-v/top*ph;
  const ticks=[0,top/2,top];
  return `<div style="display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--g1);margin-right:5px"></i>收入</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--i-pink);margin-right:5px"></i>支出</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="近 6 个月收入与支出">
   ${ticks.map(t=>`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t>=1000?(t/1000)+'k':t}</text>`).join('')}
   ${data.map((d,i)=>{const cx=L+gw*i+gw/2;return `<rect x="${cx-bw-1}" y="${y(d.r)}" width="${bw}" height="${Math.max(0,T+ph-y(d.r))}" rx="3" fill="var(--g1)"><title>${mLabel(d.m)} 收入 RM ${rm(d.r)}</title></rect><rect x="${cx+1}" y="${y(d.e)}" width="${bw}" height="${Math.max(0,T+ph-y(d.e))}" rx="3" fill="var(--i-pink)"><title>${mLabel(d.m)} 支出 RM ${rm(d.e)}</title></rect><text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${+d.m.slice(5)}月</text>`}).join('')}
  </svg>`;
}

      d.onFinal(({text})=>{dictBase=(dictBase+text);const i=document.getElementById('askIn');if(i)i.value=dictBase.trimStart()});
      d.onState(({state,reason})=>{dictOn=state!=='idle';show();

async function aiAsk(q){
  if(aiBusy)return;

  if(!(await aiReady())){toast('要在 Claude 里打开，AI 才能用');return}
  const img=aiPhoto;aiPhoto=null;if(img&&!aiImg){toast('这里不能传照片给 AI');return}
  aiMsgs.push({who:'me',text:q,img:img?URL.createObjectURL(img):''});drawAtt();const m={who:'ai',text:'',step:'思考中…',refs:[]};aiMsgs.push(m);
  aiTurns.push({role:'user',content:img?q+'\n（附了一张照片）':q});aiBusy=true;render();
  const before=JSON.stringify(S),refs=m.refs;aiCtl=new AbortController();
  const paint=()=>{if(page==='ai')render()};

    const opts={signal:aiCtl.signal,cache:false,onText:({text})=>{m.text=text;paint()}};
    if(img)opts.images=img;
    if(aiTools){opts.tools=aiToolList(refs,t=>{m.step=t;paint()});delete opts.cache}

  }catch(e){m.text=(e.text?e.text+'\n\n':'')+(e.code==='cancelled'?'（已停止）':aiErr(e));aiTurns.pop()}
  finally{aiBusy=false;if(JSON.stringify(S)!==before)m.undo=before;render()}
}
async function scanBill(f){

async function saveFile(name,data,okMsg){
  if(dl===undefined){try{dl=window.claude?.use?await window.claude.use('downloads'):null}catch(e){dl=null}}
  if(dl){try{await dl.save({filename:name,data});toast(okMsg);return true}catch(e){if(e.code!=='declined')toast('这里不能保存文件：'+(e.code||'未知原因'));return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(okMsg);return true;
}

function csvOut(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function exportCSV(k){
  let rows;
  if(k==='invoices')rows=[['Invoice No','Date','Due','Customer','Customer BRN','Customer TIN','Subtotal','Discount','SST','Total','Paid','Balance','Status']].concat(S.invoices.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(i=>{const c=calc(i),cu=cust(i.cust),p=paidOf(i);return [i.no,i.date,i.due,cu.name,cu.brn,cu.tin,c.sub,c.disc,c.taxSum,c.total,p,r2(c.total-p),invStatus(i)[0]]}));
  else if(k==='receipts')rows=[['Receipt No','Date','Invoice No','Customer','Amount','Method','Reference']].concat(S.receipts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>{const i=S.invoices.find(x=>x.id===r.inv)||{};return [r.no,r.date,i.no,cust(i.cust).name,r.amt,METHOD_EN[r.method]||r.method,r.ref]}));
  else rows=[['Expense No','Date','Supplier','Supplier TIN','Category','Description','Amount (incl. SST)','SST','Supplier Bill No','Paid','Method']].concat(S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const sp=sup(e.sup)||{};return [e.no,e.date,sp.name||'',sp.tin||'',(CATS[e.cat]||CATS.other)[0],e.desc,e.amt,e.sst,e.bill,e.paid?'Yes':'No',METHOD_EN[e.method]||e.method]}));
  saveFile(`Akaun-${k}_${today()}.csv`,new Blob([csvOut(rows)],{type:'text/csv'}),'CSV 已导出');
}

let dl;
async function exportPDF(k,id,btn){
  const d=docInfo(k,id);
  if(!window.html2canvas||!window.jspdf)return toast('PDF 工具还没载入，请稍后再试');
  const old=btn.textContent;btn.disabled=true;btn.textContent='生成中…';
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:760px';host.innerHTML=d.html;document.body.appendChild(host);
  try{
    const cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});pdf.setProperties({title:d.no});const W=210,H=297,h=cv.height*W/cv.width;
    const img=cv.toDataURL('image/jpeg',0.92);let y=0;
    pdf.addImage(img,'JPEG',0,0,W,h);
    for(y=H;y<h-2;y+=H){pdf.addPage();pdf.addImage(img,'JPEG',0,-y,W,h)}
    const blob=pdf.output('blob');const name=`${d.no} ${d.c.name}.pdf`.replace(/[\\/:*?"<>|]/g,'');
    await saveFile(name,blob,'PDF 已导出');
  }catch(e){toast('PDF 生成失败，请再试一次')}
  finally{host.remove();btn.disabled=false;btn.textContent=old}
}

/* ---------- Google Drive backup (uses the viewer's own Google Drive connector) ---------- */
const DRV={server:'Google Drive',folder:'账簿通备份',marker:'AKAUN-BACKUP-v1',busy:false,mcp:undefined,timer:null};
function drvState(){try{return Object.assign({on:false,last:'',lastAt:0,folderId:''},JSON.parse(localStorage.getItem('akaun-drive'))||{})}catch(e){return {on:false,last:'',lastAt:0,folderId:''}}}
function drvSet(d){try{localStorage.setItem('akaun-drive',JSON.stringify(d))}catch(e){}}
async function drvCall(tool,input){
  if(DRV.mcp===undefined){try{DRV.mcp=await claude.use('mcp')}catch(e){DRV.mcp=null}}
  if(!DRV.mcp)throw new Error('no_mcp');
  let r;
  if(typeof DRV.mcp.server==='function'){const s=await DRV.mcp.server(DRV.server);r=await s[tool](input)}
  else r=await DRV.mcp.callTool(DRV.server,tool,input);
  return drvPayload(r);
}
function drvPayload(r){
  let p=(r&&r.payload!==undefined)?r.payload:r;
  if(p&&p.structuredContent)p=p.structuredContent;
  if(p&&Array.isArray(p.content)){const t=p.content.map(x=>x&&x.text||'').join('');try{return JSON.parse(t)}catch(e){return t}}
  if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return p}}
  return p;
}
function drvStrings(o,out=[]){if(typeof o==='string')out.push(o);else if(Array.isArray(o))o.forEach(x=>drvStrings(x,out));else if(o&&typeof o==='object')Object.values(o).forEach(x=>drvStrings(x,out));return out}
function drvFiles(o,out=[]){if(Array.isArray(o))o.forEach(x=>drvFiles(x,out));else if(o&&typeof o==='object'){if(o.id&&(o.title||o.name))out.push(o);else Object.values(o).forEach(x=>drvFiles(x,out))}return out}
function drvId(o){const f=drvFiles(o)[0];if(f)return f.id;return o&&(o.id||o.fileId)||''}
function drvErr(e){
  const m=String(e&&(e.code||e.message)||e);
  if(/no_mcp|unavailable|not_connected|server_not_connected/i.test(m))return '没连上 Google Drive。请确认你的 Claude 账号已连接 Google Drive，并用 claude.ai 打开这个页面。';
  if(/denied|consent|authz|permission/i.test(m))return '你没有允许这个页面使用 Google Drive，所以没有备份。';
  return 'Google Drive 操作失败：'+m.slice(0,120);
}
async function drvFolder(){
  const d=drvState();if(d.folderId)return d.folderId;
  const q="title = '"+DRV.folder+"' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";
  const found=drvFiles(await drvCall('search_files',{query:q,pageSize:1,excludeContentSnippets:true}));
  let id=found[0]&&found[0].id;
  if(!id)id=drvId(await drvCall('create_file',{title:DRV.folder,mimeType:'application/vnd.google-apps.folder'}));
  if(id){d.folderId=id;drvSet(d)}
  return id;
}
function stamp(){const n=new Date(),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'-'+p(n.getHours())+p(n.getMinutes())}
async function driveBackup(auto){
  if(DRV.busy)return;DRV.busy=true;
  try{
    const parent=await drvFolder();
    const body={title:'akaun-backup-'+stamp()+'.txt',textContent:DRV.marker+'\n'+JSON.stringify(S),contentMimeType:'text/plain',disableConversionToGoogleType:true};
    if(parent)body.parentId=parent;
    const r=await drvCall('create_file',body);
    if(!drvId(r)&&!(r&&typeof r==='object'))throw new Error('没有收到 Drive 的确认');
    const d=drvState();d.on=true;d.last=new Date().toISOString();d.lastAt=Date.now();drvSet(d);
    toast(auto?'已自动备份到 Google Drive':'已备份到 Google Drive「'+DRV.folder+'」');
  }catch(e){if(!auto)toast(drvErr(e));else try{console.warn('drive auto backup',e)}catch(_){}}
  finally{DRV.busy=false;if(!$('#ov').hidden&&$('#drvBox'))driveModal()}
}
function driveAuto(){
  const d=drvState();if(!d.on)return;
  if(Date.now()-d.lastAt<24*3600*1000)return;
  clearTimeout(DRV.timer);DRV.timer=setTimeout(()=>driveBackup(true),20000);
}
async function driveRestore(btn){
  if(DRV.busy)return;
  if(btn.dataset.arm!=='1'){btn.dataset.arm='1';btn.textContent='再按一次：用 Drive 的备份覆盖现在的数据';return}
  DRV.busy=true;btn.disabled=true;btn.textContent='读取中…';
  try{
    const q="title contains 'akaun-backup' and mimeType = 'text/plain' and trashed = false";
    const list=drvFiles(await drvCall('search_files',{query:q,orderBy:'modifiedTime desc',pageSize:5,excludeContentSnippets:true}));
    if(!list.length){toast('Drive 里还没有找到账簿通的备份');return}
    const txt=drvStrings(await drvCall('read_file_content',{fileId:list[0].id})).join('\n');
    const at=txt.indexOf(DRV.marker),a=txt.indexOf('{',at<0?0:at),z=txt.lastIndexOf('}');
    if(at<0||a<0||z<a)throw new Error('备份文件内容读不出来');
    const data=JSON.parse(txt.slice(a,z+1));
    if(!data||!data.company||!Array.isArray(data.invoices))throw new Error('这不是账簿通的备份文件');
    S=data;if(!saveChecked())return;closeModal();go('home');toast('已从 Drive 恢复：'+(list[0].title||list[0].name||''));
  }catch(e){toast(drvErr(e))}
  finally{DRV.busy=false;btn.disabled=false}
}
function driveModal(){
  const d=drvState(),demo=S.company&&S.company.name==='Contoh Strategi Sdn. Bhd.';
  openModal('Google Drive 备份',`<div id="drvBox" style="display:flex;flex-direction:column;gap:12px">
    <p style="margin:0">备份会存到你自己 Google Drive 的「${DRV.folder}」文件夹，每次一个新文件，旧备份不会被覆盖。</p>
    ${demo?'<div class="note"><b>提醒：</b>现在还是示范资料。可以先试备份，但真正开始记账后再备份才有意义。</div>':''}
    <div class="panel" style="box-shadow:none;border:1px solid var(--line)"><div>最近一次备份：<b>${d.last?new Date(d.last).toLocaleString('zh-CN'):'还没有'}</b></div>
    <div style="margin-top:8px" class="row"><button class="btn pri" data-act="driveSave" ${DRV.busy?'disabled':''}>${DRV.busy?'处理中…':'立即备份到 Drive'}</button>
    <button class="btn" data-act="driveLoad">从 Drive 恢复最新备份</button></div></div>
    <button class="btn" data-act="driveAutoT">${d.on?'✓ 已开启':'未开启'}：有改动时每天自动备份一次</button>
    <small style="color:var(--muted)">自动备份要先成功做过一次手动备份才会生效。第一次使用时，Claude 会请你允许这个页面使用 Google Drive。账目资料只会存到你自己的 Drive，不会发给别人。</small></div>`);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeModal()});
render();
</script>
